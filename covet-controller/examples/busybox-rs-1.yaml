apiVersion: covetrol/v1
kind: ReplicaSet
metadata:
    name: busybox-rs
spec:
    replicas: 1
    template:
        apiVersion: covetrol/v1
        kind: Pod
        metadata:
            name: busybox
        spec:
            containers:
                - name: main
                  image: busybox
                  command:
                      - /bin/busybox
                      - sleep
                  args:
                      - '600'
